<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#f6f3fc">
  <meta name="robots" content="noindex, nofollow">
  <meta name="description" content="Саша, есть минутка? Карьерный симулятор к проводам Саши Рубина.">
  <title>Саша, есть минутка?</title>
  <style>
:root {
  color-scheme: light;
  --bg: #f6f3fb;
  --paper: #fff;
  --ink: #211a33;
  --muted: #625971;
  --quiet: #756781;
  --line: #e5def0;
  --purple: #603cc5;
  --purple-dark: #4d2ea8;
  --lilac: #f2ebff;
  --shadow: 0 10px 26px #51338b0a, 0 2px 4px #51338b06;
  font-family: "Inter", "Segoe UI", -apple-system, BlinkMacSystemFont, Arial, sans-serif;
  background: var(--bg);
  color: var(--ink);
  font-synthesis: none;
}

* { box-sizing: border-box; }
body { margin: 0; min-width: 300px; min-height: 100vh; }
button, select { font: inherit; }
button { cursor: pointer; }
[hidden] { display: none !important; }
:focus-visible { outline: 3px solid #8555e6; outline-offset: 4px; }
h1, h2, p, ol, blockquote, figure { margin: 0; }
h2 { font-size: 1.0625rem; line-height: 1.25; letter-spacing: -.02em; }

.shell { width: min(100% - 64px, 1240px); margin-inline: auto; padding: 26px 0 16px; }
.topbar { display: flex; align-items: center; justify-content: space-between; gap: 16px; margin-bottom: 22px; min-height: 54px; }
.brand { display: flex; align-items: center; gap: 12px; }
.brand-mark {
  position: relative;
  width: 43px;
  height: 43px;
  flex: 0 0 auto;
  border-radius: 13px;
  background: #6842d5;
  box-shadow: 0 3px 0 #4b2bad, inset 0 1px 0 #875fe8;
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 2.5px;
  isolation: isolate;
}
.brand-mark::before {
  content: "";
  position: absolute;
  z-index: -1;
  width: 24px;
  height: 16px;
  background: #fff;
  border-radius: 5px;
  box-shadow: 0 2px 0 #e0d2fa;
}
.brand-mark::after {
  content: "";
  position: absolute;
  top: 27px;
  left: 13px;
  background: #fff;
  width: 7px;
  height: 7px;
  clip-path: polygon(0 0,100% 0,0 100%);
}
.brand-mark i { border-radius: 50%; width: 3px; height: 3px; background: #6842d5; }
.brand-name { display: block; font-size: 1.24rem; letter-spacing: -.035em; font-weight: 760; line-height: 1.18; }
.brand-caption { display: block; margin-top: 3px; font-size: .8125rem; color: var(--muted); }
.fullscreen, .history-toggle {
  background: var(--paper);
  color: #514164;
  border: 1px solid var(--line);
  border-radius: 10px;
  padding: 8px 11px;
  font-size: .875rem;
  font-weight: 650;
}
.fullscreen { display: flex; gap: 9px; align-items: center; min-height: 39px; }
.fullscreen-icon { position: relative; width: 13px; height: 13px; border: 1.5px solid currentColor; border-radius: 1px; }
.fullscreen-icon::before, .fullscreen-icon::after { content: ""; position: absolute; background: #fff; }
.fullscreen-icon::before { inset: 3px -2px; }
.fullscreen-icon::after { inset: -2px 3px; }
.fullscreen:hover .fullscreen-icon::before, .fullscreen:hover .fullscreen-icon::after { background: var(--lilac); }

.dashboard { display: grid; grid-template-columns: minmax(0, 1.95fr) minmax(0, 1fr); gap: 16px; align-items: stretch; }
.stage, .office, .stats, .timeline { background: var(--paper); border: 1px solid var(--line); box-shadow: var(--shadow); border-radius: 20px; }
.stage { display: flex; flex-direction: column; padding: 28px 35px 26px; scroll-margin-top: 12px; min-width: 0; }
.scene-meta, .counter, .timeline-heading, .office-heading, .metric { display: flex; align-items: center; }
.scene-meta, .timeline-heading, .office-heading { justify-content: space-between; gap: 12px; }
.category {
  display: inline-flex;
  align-items: center;
  gap: 7px;
  min-height: 29px;
  padding: 4px 10px;
  background: var(--lilac);
  color: #5835ac;
  font-size: .8125rem;
  line-height: 1.2;
  font-weight: 720;
  border-radius: 7px;
}
.category::before { content: ""; border: 1.5px solid #754bd9; height: 6px; width: 6px; transform: rotate(45deg); }
.counter { gap: 8px; white-space: nowrap; font-size: .8125rem; color: var(--muted); }
.counter-value, .stat-value { color: #4e396d; font-variant-numeric: tabular-nums; font-weight: 760; }
.counter-value { letter-spacing: .015em; }
.progress { display: flex; gap: 4px; margin-top: 12px; }
.progress i { flex: 1; height: 3px; border-radius: 4px; background: #eee8f7; }
.progress .is-current { background: #cbb3f9; }
.progress .is-complete { background: #7851db; }

.intro-message { display: flex; flex-direction: column; justify-content: center; flex: 1; align-items: flex-start; padding: 25px 0 27px; }
.message-sender { display: flex; align-items: center; gap: 10px; color: #39294c; font-size: .9375rem; }
.message-sender div span { display: block; margin-top: 2px; color: var(--quiet); font-size: .8125rem; }
.avatar {
  display: grid;
  place-items: center;
  width: 37px;
  height: 37px;
  border-radius: 11px;
  background: #eadffd;
  color: #6040ac;
  font-weight: 800;
}
.scene-title { font-size: clamp(2rem, 3.5vw, 3.125rem); letter-spacing: -.035em; font-weight: 790; line-height: 1.02; overflow-wrap: anywhere; text-wrap: balance; }
.scene-title:focus { outline: none; }
.intro-title { margin-top: 22px; font-size: clamp(3rem, 5.4vw, 5rem); letter-spacing: -.055em; line-height: .99; }
.intro-accent { display: block; color: #6841cf; margin-top: 5px; }
.prompt { padding: 24px 0 19px; }
.scene-body { font-size: clamp(1.0625rem, 1.42vw, 1.25rem); line-height: 1.46; color: #51475f; margin-top: 12px; max-width: 58ch; }
.choices { display: grid; gap: 8px; margin-top: auto; }
.choice {
  display: grid;
  grid-template-columns: 32px 1fr 11px;
  align-items: center;
  gap: 13px;
  min-height: 57px;
  width: 100%;
  border: 1px solid #e5daf4;
  border-radius: 11px;
  background: #faf7ff;
  color: #322148;
  padding: 9px 15px 9px 11px;
  text-align: left;
  font-size: clamp(1rem, 1.36vw, 1.1875rem);
  line-height: 1.24;
  font-weight: 680;
}
.choice-key {
  font: inherit;
  display: grid;
  place-items: center;
  width: 31px;
  height: 31px;
  background: #eee5fc;
  color: #6740bf;
  border: 1px solid #e7d9fa;
  border-bottom-width: 2px;
  border-radius: 7px;
  font-size: .875rem;
}
.choice-indicator { width: 10px; height: 10px; border-radius: 50%; border: 1.5px solid #c4b2df; }
.primary, .secondary {
  min-height: 49px;
  border-radius: 10px;
  padding: 10px 19px;
  text-align: center;
  line-height: 1.2;
  font-weight: 740;
  font-size: 1rem;
}
.primary { background: var(--purple); color: #fff; border: 1px solid #5935bd; box-shadow: 0 3px 0 #4c2ca4; }
.secondary { background: #f6f0ff; color: #533595; border: 1px solid #e4d7f6; }
.intro-action { min-height: 56px; width: 100%; font-size: 1.13rem; }
.next { align-self: flex-start; min-width: 145px; margin-top: auto; }
@media (hover: hover) {
  .choice:hover { background: #f0e8fe; border-color: #bba4ef; }
  .choice:hover .choice-indicator { border: 3px solid #774fda; background: #fff; }
  .primary:hover { background: var(--purple-dark); }
  .secondary:hover, .fullscreen:hover, .history-toggle:hover { background: var(--lilac); }
}
.primary:active { box-shadow: 0 1px 0 #4c2ca4; transform: translateY(2px); }

.report, .ending-story { padding: 20px 0 15px; }
.stage-label { font-size: .84375rem; font-weight: 680; color: #7256a4; margin-bottom: 6px; }
.report-title { font-size: clamp(1.85rem, 3vw, 2.625rem); }
.deltas { display: flex; flex-wrap: wrap; gap: 5px; margin-top: 12px; }
.delta { display: inline-flex; align-items: center; gap: 5px; padding: 5px 8px; border-radius: 6px; font-size: .8125rem; }
.delta.up { background: #e9f6ee; color: #265d45; }
.delta.down { background: #fceef0; color: #8a3e5a; }
.delta.neutral { background: #f2edf7; color: #5b4b6c; }
.fact {
  background: #f3edfd;
  border: 1px solid #eadcf9;
  border-left: 3px solid #8e64e7;
  border-radius: 8px;
  padding: 9px 12px 10px;
  margin-top: 13px;
  color: #4c3968;
  font-size: .9375rem;
  line-height: 1.36;
}
.fact-heading { color: #5934aa; font-size: .875rem; margin-bottom: 4px; font-weight: 760; }
.fact-choice { margin-top: 4px; font-weight: 650; }
.photo { margin-top: 9px; font-size: .9375rem; }
.photo img { display: block; max-width: 100%; max-height: 150px; object-fit: contain; object-position: left; border-radius: 6px; }
.photo figcaption { color: var(--muted); font-size: .8125rem; margin-top: 3px; }
.farewell-note { margin-top: 9px; color: #633eb4; font-weight: 720; font-size: 1.0625rem; }
.ending-story .scene-title { font-size: clamp(1.85rem, 3.2vw, 2.75rem); }
.ending-story .scene-body { font-size: 1.0625rem; margin-top: 8px; }
.ending-story .fact { margin-top: 8px; }
.replay { border: 0; padding: 0; margin: auto 0 12px; min-inline-size: 0; }
.replay legend { padding: 0; font-size: .875rem; font-weight: 760; margin-bottom: 6px; }
.evidence { display: grid; gap: 6px; grid-template-columns: 1fr 1fr; }
.evidence-card { display: flex; align-items: center; gap: 7px; cursor: pointer; background: #fbf8ff; border: 1px solid #e9def6; border-radius: 8px; padding: 6px 7px; }
.evidence-card:has(:checked) { background: #f2eafe; border-color: #ba9deb; }
.evidence-card small { color: #655478; display: block; margin-bottom: 2px; }
.evidence-card strong { display: block; line-height: 1.2; font-size: .875rem; }
.evidence-card input { accent-color: var(--purple); flex-shrink: 0; }
.other-fork { display: flex; align-items: center; gap: 6px 10px; margin-top: 7px; font-size: .8125rem; color: var(--muted); }
.other-fork span { flex-shrink: 0; }
.other-fork select {
  min-width: 0; max-width: 100%; width: fit-content;
  border: 1px solid var(--line); background-color: #fff; color: #4d376d;
  border-radius: 6px; padding: 4px 24px 4px 7px; appearance: none;
  background-image: linear-gradient(45deg, transparent 50%, #7753b5 50%), linear-gradient(135deg, #7753b5 50%, transparent 50%);
  background-position: calc(100% - 11px) center, calc(100% - 7px) center;
  background-size: 4px 4px; background-repeat: no-repeat;
}
.ending-actions { display: flex; flex-wrap: wrap; gap: 8px; }
.ending-actions > button { flex: 1 0 auto; min-height: 42px; padding-inline: 11px; }

.sidebar { display: grid; align-content: start; gap: 12px; min-width: 0; }
.office {
  background: radial-gradient(ellipse at 53% 68%, #f6eeff 13%, #f1e8fc 75%, #eee3fa);
  border-color: #e7d8f6;
  overflow: hidden;
  padding: 15px 16px 10px;
}
.office-state { border: 1px solid #e2d2f4; background: #fcf8ff; color: #5d437e; border-radius: 6px; padding: 4px 7px; font-size: .8125rem; font-weight: 650; }
#office-art { width: 100%; height: 182px; display: block; object-fit: contain; image-rendering: pixelated; }
.office-caption { text-align: center; color: #635176; font-size: .8125rem; padding: 2px 0 1px; }
.stats { padding: 14px 16px 15px; }
#meters { display: grid; gap: 9px; margin-top: 10px; }
.stat { --meter: #8255dc; --icon-bg: #efe5fc; position: relative; }
.stat-energy { --meter: #df8b31; --icon-bg: #fff0df; }
.stat-skill { --meter: #378c85; --icon-bg: #e0f3ef; }
.stat-love { --meter: #d769a0; --icon-bg: #fce7f2; }
.metric { gap: 7px; }
.stat-icon { width: 18px; height: 18px; border-radius: 5px; display: grid; place-items: center; background: var(--icon-bg); color: var(--meter); }
.stat-icon::after { content: ""; width: 10px; height: 10px; background: currentColor; }
.stat-icon-impact::after { clip-path: polygon(0 100%, 0 64%, 23% 64%, 23% 100%, 38% 100%, 38% 37%, 62% 37%, 62% 100%, 77% 100%, 77% 8%, 100% 8%, 100% 100%); }
.stat-icon-energy::after { clip-path: polygon(47% 0, 96% 0, 62% 41%, 91% 41%, 33% 100%, 45% 57%, 8% 57%); }
.stat-icon-skill::after { clip-path: polygon(50% 0, 61% 36%, 100% 50%, 61% 63%, 50% 100%, 38% 63%, 0 50%, 38% 36%); }
.stat-icon-love::after { clip-path: polygon(0 25%, 22% 7%, 50% 22%, 79% 7%, 100% 25%, 100% 52%, 50% 96%, 0 52%); }
.stat-name, .stat-value { font-size: .875rem; }
.stat-name { font-weight: 650; }
.stat-value { margin-left: auto; }
.meter { position: absolute; width: 1px; height: 1px; overflow: hidden; opacity: 0; }
.meter-track { height: 5px; margin-top: 4px; border-radius: 6px; background: #eee8f5; overflow: hidden; }
.meter-fill { display: block; height: 100%; border-radius: 6px; background: var(--meter); }

.timeline { grid-column: 1 / -1; padding: 14px 18px 15px; }
.history-toggle { padding: 5px 8px; font-size: .8125rem; }
.milestones { display: grid; grid-template-columns: repeat(4, 1fr); list-style: none; padding: 0; margin-top: 12px; }
.milestone { position: relative; display: grid; gap: 1px; min-width: 0; padding-right: 8px; color: #5d526b; }
.milestone:not(:last-child)::after { content: ""; position: absolute; top: 5px; left: 12px; width: calc(100% - 12px); height: 1px; background: #e3d9f0; }
.milestone.reached:not(:last-child)::after { background: #c2a8ef; }
.marker { width: 11px; height: 11px; background: #f3ebfb; border: 1px solid #dfd0ee; border-radius: 50%; margin-bottom: 4px; }
.milestone.reached .marker { background: #cbb4f2; border-color: #bd9bec; }
.milestone.active .marker { background: #7449d7; border-color: #7449d7; box-shadow: 0 0 0 3px #efe5fe; }
.milestone strong { font-size: .875rem; }
.milestone.active strong { color: #5b35b5; }
.milestone span { font-size: .8125rem; }
.history { padding: 10px 0 0 22px; margin-top: 12px; border-top: 1px solid var(--line); }
.history li { padding: 4px 2px; font-size: .9375rem; }
.history li span { display: block; color: var(--muted); }
.footer { display: flex; justify-content: space-between; gap: 10px; margin-top: 13px; padding-inline: 2px; color: var(--quiet); font-size: .8125rem; }

@media (min-width: 761px) and (min-height: 800px) {
  .shell { padding-top: 37px; }
  .topbar { margin-bottom: 26px; }
  .dashboard { gap: 18px; }
  .stage { min-height: 495px; }
  .sidebar { gap: 15px; }
  .office, .stats { padding-inline: 19px; }
  #office-art { height: 204px; }
  #meters { gap: 11px; margin-top: 12px; }
  .stats { padding-block: 17px 19px; }
  .timeline { padding: 17px 20px 18px; }
}

@media (min-width: 761px) and (max-height: 740px) {
  .shell { padding-top: 13px; }
  .topbar { margin-bottom: 12px; min-height: 47px; }
  .dashboard { gap: 12px; }
  .stage { padding: 18px 24px 19px; }
  #office-art { height: 148px; }
  .office, .stats { padding-block: 10px; }
  .timeline { padding-block: 10px; }
  .footer { margin-top: 8px; }
}

@media (max-width: 1000px) {
  .shell { width: calc(100% - 40px); }
  .stage { padding-inline: 24px; }
  .sidebar { gap: 10px; }
}

@media (max-width: 760px) {
  .shell { width: calc(100% - 28px); padding-block: 12px 14px; }
  .topbar { margin-bottom: 12px; min-height: 45px; }
  .brand { gap: 9px; }
  .brand-mark { width: 36px; height: 36px; border-radius: 10px; }
  .brand-mark::after { top: 23px; left: 9px; }
  .brand-name { font-size: 1.04rem; }
  .brand-caption { font-size: .75rem; }
  .fullscreen { padding: 8px; min-width: 40px; min-height: 40px; justify-content: center; }
  .fullscreen #fullscreen-label { position: absolute; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%); }
  .dashboard { grid-template-columns: 1fr; gap: 12px; }
  .stage, .stats, .office, .timeline { border-radius: 15px; }
  .stage { padding: 15px; }
  .intro-message { padding: 26px 0 35px; }
  .intro-title { margin-top: 18px; font-size: clamp(2.55rem, 10vw, 4.3rem); }
  .intro-action { min-height: 51px; }
  .prompt { padding: 20px 0 16px; }
  .scene-title:not(.intro-title) { font-size: clamp(1.8rem, 6.85vw, 2.7rem); }
  .scene-body { margin-top: 10px; }
  .choice { padding: 8px; grid-template-columns: 26px 1fr 9px; gap: 8px; min-height: 49px; }
  .choice-key { width: 25px; height: 26px; }
  .choice-indicator { width: 8px; height: 8px; }
  .next { align-self: stretch; }
  .sidebar { grid-template-columns: 1fr 1fr; align-items: stretch; gap: 10px; }
  .stats { grid-area: 1 / 1; }
  .office { grid-area: 1 / 2; }
  .office, .stats { padding: 11px 10px; }
  .office-heading { gap: 4px; flex-wrap: wrap; }
  .office-state { padding: 3px 4px; font-size: .75rem; }
  #office-art { height: 112px; }
  .office-caption { font-size: .75rem; }
  .milestones { grid-template-columns: repeat(4, 1fr); }
  .milestone { grid-template-rows: 15px auto; align-content: start; }
  .milestone span { display: none; }
  .milestone strong { font-size: .8125rem; }
  .timeline { padding: 12px; }
  .other-fork { flex-wrap: wrap; }
  .ending-actions > button { flex-basis: 100%; }
}

@media (max-width: 360px) {
  .counter-label { display: none; }
  .stat-name { font-size: .8125rem; }
  .evidence { grid-template-columns: 1fr; }
  .timeline-heading { flex-wrap: wrap; }
}
  </style>
</head>
<body>
  <div class="shell">
    <header class="topbar">
      <div class="brand">
        <span class="brand-mark" aria-hidden="true"><i></i><i></i><i></i></span>
        <div><span class="brand-name">Саша, есть минутка?</span><span class="brand-caption">Карьерный симулятор</span></div>
      </div>
      <div class="header-actions">
        <button type="button" id="fullscreen" class="fullscreen" hidden><span aria-hidden="true" class="fullscreen-icon"></span><span id="fullscreen-label">На весь экран</span></button>
      </div>
    </header>
    <main class="dashboard">
      <section class="stage" id="stage" aria-label="Игровая сцена"></section>
      <aside class="sidebar" aria-label="Офис и показатели">
        <section class="office" aria-labelledby="office-title">
          <div class="office-heading">
            <h2 id="office-title">Офис</h2>
            <span id="office-state" class="office-state"></span>
          </div>
          <canvas id="office-art" width="268" height="150" role="img" aria-label="Офис Саши"></canvas>
          <p id="office-caption" class="office-caption"></p>
        </section>
        <section class="stats" aria-labelledby="stats-title">
          <h2 id="stats-title">Показатели</h2>
          <div id="meters"></div>
        </section>
      </aside>
      <section class="timeline" aria-labelledby="timeline-title">
        <div class="timeline-heading">
          <h2 id="timeline-title">Карьерный таймлайн</h2>
          <button type="button" class="history-toggle" id="history-toggle" aria-expanded="false" aria-controls="history" hidden>История решений</button>
        </div>
        <ol id="milestones" class="milestones"></ol>
        <ol id="history" class="history" hidden></ol>
      </section>
    </main>
    <footer class="footer"><span>К проводам Саши Рубина</span><span id="save-status"></span></footer>
  </div>
  <noscript>Включи JavaScript, чтобы открыть игру.</noscript>
  <script>
// Здесь истории, варианты, эффекты, условия сцен и концовки.
// Как добавить реальный эпизод и фото — в README.md.
((root) => {
  const content = {
    title: 'Саша, есть минутка?',
    intro: {
      sender: 'Коллега',
      title: 'Саш, есть минутка?',
      accent: 'Тут идея',
      button: 'Зря, конечно, но давай',
    },
    stats: {
      impact: { label: 'Импакт', initial: 25 },
      energy: { label: 'Энергия', initial: 70 },
      skill: { label: 'Навыки', initial: 40 },
      love: { label: 'Любовь команды', initial: 45 },
    },
    chapters: [
      { title: 'Разработка', note: 'Вопрос на планировании' },
      { title: 'Рабочие будни', note: 'Пятница и другие сюрпризы' },
      { title: 'Команда', note: 'Кто теперь решает?' },
      { title: 'Проводы', note: 'Последний рабочий день' },
    ],
    // Выбирается первое подходящее условие. Последняя сцена в каждом раунде без условий.
    rounds: [
      { chapter: 0, routes: [{ scene: 'career' }] },
      { chapter: 1, routes: [
        { scene: 'restart', all: ['developer'] },
        { scene: 'two-hats', all: ['hybrid'] },
        { scene: 'quarter' },
      ] },
      { chapter: 1, routes: [{ scene: 'friday' }] },
      { chapter: 1, routes: [{ scene: 'marketing' }] },
      { chapter: 1, routes: [
        { scene: 'release-chat', all: ['friday-rescue'] },
        { scene: 'rollback-review', all: ['friday-rollback'] },
        { scene: 'handover' },
      ] },

  <script>
((root) => {
  function createGame(content) {
    const { stats, rounds, scenes, endings } = content;

    function initial() {
      return {
        moves: [],
        stats: Object.fromEntries(Object.entries(stats).map(([key, stat]) => [key, stat.initial])),
        tags: new Map(),
      };
    }

    function matches(rule, run) {
      const { all = [], any = [], count = {}, min = {}, max = {} } = rule;
      return all.every((tag) => run.tags.has(tag))
        && (!any.length || any.some((tag) => run.tags.has(tag)))
        && Object.entries(count).every(([tag, amount]) => (run.tags.get(tag) ?? 0) >= amount)
        && Object.entries(min).every(([key, value]) => run.stats[key] >= value)
        && Object.entries(max).every(([key, value]) => run.stats[key] <= value);
    }

    function current(run) {
      const round = rounds[run.moves.length];
      if (!round) return null;
      const route = round.routes.find((rule) => matches(rule, run));
      if (!route || !scenes[route.scene]) throw new Error('Не найдена сцена раунда ' + (run.moves.length + 1));
      return { ...scenes[route.scene], id: route.scene, chapter: round.chapter };
    }

    function act(run, choiceId) {
      const scene = current(run);
      const choice = scene?.choices.find(({ id }) => id === choiceId);
      if (!choice) throw new Error('Не найден вариант ' + choiceId);
      const nextStats = { ...run.stats };
      const changes = {};
      for (const [key, amount] of Object.entries(choice.stats ?? {})) {
        nextStats[key] = Math.max(0, Math.min(100, nextStats[key] + amount));
        changes[key] = nextStats[key] - run.stats[key];
      }
      const tags = new Map(run.tags);
      for (const tag of new Set(choice.tags ?? [])) tags.set(tag, (tags.get(tag) ?? 0) + 1);
      return { moves: [...run.moves, { scene, choice, changes }], stats: nextStats, tags };
    }

    function finish(run) {
      if (current(run)) return null;
      const ending = endings.find(({ when }) => matches(when, run));
      if (!ending) throw new Error('Не найдена концовка');
      const ranked = [];
      for (const tag of ending.evidence) {
        run.moves.forEach(({ choice }, index) => {
          if (choice.tags?.includes(tag) && !ranked.includes(index)) ranked.push(index);
        });
      }
      // При добавлении новых сцен остаётся доступной вся сыгранная история.
      const references = [...new Set([...ranked, ...run.moves.map((_, index) => index).reverse()])]
        .slice(0, 2).sort((a, b) => a - b);
      return { ...ending, references };
    }

    function encode(run) {
      return run.moves.map(({ scene, choice }) => [scene.id, choice.id]);
    }

    function restore(moves) {
      let run = initial();
      for (const move of Array.isArray(moves) ? moves : []) {
        const scene = current(run);
        if (!scene || !Array.isArray(move) || scene.id !== move[0]
            || !scene.choices.some(({ id }) => id === move[1])) break;
        run = act(run, move[1]);
      }
      return run;
    }

    function rewind(run, index) {
      if (!Number.isInteger(index) || index < 0 || index >= run.moves.length) {
        throw new Error('Не найдена развилка');
      }
      return restore(encode(run).slice(0, index));
    }

    return { initial, current, act, finish, encode, restore, rewind };
  }

  if (typeof module === 'object' && module.exports) module.exports = createGame;
  else root.createGame = createGame;
})(globalThis);
  </script>

((root) => {
  function drawOffice(canvas, room) {
    const ctx = canvas.getContext('2d');
    ctx.clearRect(0, 0, canvas.width, canvas.height);

    function polygon(points, color) {
      ctx.fillStyle = color;
      ctx.beginPath();
      points.forEach(([x, y], index) => {
        if (index === 0) ctx.moveTo(x, y);
        else ctx.lineTo(x, y);
      });
      ctx.closePath();
      ctx.fill();
    }

    function project([x, y, z]) {
      return [Math.round(134 + (x - y) * 12), Math.round(61 + (x + y) * 5.2 - z * 10)];
    }

    function plane(points, color) {
      polygon(points.map(project), color);
    }

    function prism(x, y, z, w, d, h, [top, left, right]) {
      plane([[x, y + d, z], [x + w, y + d, z], [x + w, y + d, z + h], [x, y + d, z + h]], left);
      plane([[x + w, y, z], [x + w, y + d, z], [x + w, y + d, z + h], [x + w, y, z + h]], right);
      plane([[x, y, z + h], [x + w, y, z + h], [x + w, y + d, z + h], [x, y + d, z + h]], top);
    }

    const colors = {
      purple: ['#8060d0', '#6045a6', '#4b348a'],
      lavender: ['#e4dbfb', '#b49cde', '#987bc3'],
      white: ['#fff8ed', '#e8d6d8', '#c1a6c5'],
      wood: ['#f6c996', '#d5a382', '#b28089'],
      ink: ['#624491', '#352456', '#251a3d'],
      mint: ['#b1e5ca', '#78b9a7', '#508e87'],
      amber: ['#ffd68c', '#dd9771', '#b97776'],
      coral: ['#f8a9a0', '#d97288', '#ac5277'],
    };

    function back(x, z, w, h, color) {
      plane([[x, 0.16, z], [x + w, 0.16, z], [x + w, 0.16, z + h], [x, 0.16, z + h]], color);
    }

    function side(y, z, w, h, color) {
      plane([[0.16, y, z], [0.16, y + w, z], [0.16, y + w, z + h], [0.16, y, z + h]], color);
    }

    function star(x, y, size, color) {
      polygon([[x, y - size], [x + 1, y - 1], [x + size, y], [x + 1, y + 1],
        [x, y + size], [x - 1, y + 1], [x - size, y], [x - 1, y - 1]], color);
    }

    function plant(x, y, tall = false) {
      prism(x, y, 0, 0.56, 0.56, 0.48, colors.white);
      prism(x + 0.23, y + 0.21, 0.42, 0.11, 0.12, tall ? 1.15 : 0.65, colors.mint);
      prism(x + 0.06, y + 0.25, tall ? 1.22 : 0.83, 0.5, 0.32, 0.32, colors.mint);
      prism(x + 0.30, y + 0.04, tall ? 1.48 : 1.0, 0.38, 0.30, 0.36, colors.mint);
    }

    function desk(x, y, screenColor = '#c4a1ff') {
      for (const [dx, dy] of [[0.08, 0.1], [1.77, 0.1], [0.08, 0.92], [1.77, 0.92]]) {
        prism(x + dx, y + dy, 0, 0.12, 0.12, 0.84, colors.lavender);
      }
      prism(x, y, 0.84, 2, 1.12, 0.15, colors.wood);
      prism(x + 0.8, y + 0.27, 0.99, 0.39, 0.24, 0.23, colors.ink);
      prism(x + 0.36, y + 0.21, 1.19, 1.15, 0.19, 0.72, colors.ink);
      plane([[x + .43, y + .405, 1.27], [x + 1.44, y + .405, 1.27],
        [x + 1.44, y + .405, 1.84], [x + .43, y + .405, 1.84]], screenColor);
      plane([[x + .56, y + .41, 1.67], [x + 1.23, y + .41, 1.67],
        [x + 1.23, y + .41, 1.75], [x + .56, y + .41, 1.75]], '#fff2e6');
      plane([[x + .56, y + .41, 1.49], [x + .95, y + .41, 1.49],
        [x + .95, y + .41, 1.57], [x + .56, y + .41, 1.57]], '#fff2e6');
      prism(x + .55, y + .67, .99, .79, .25, .055, colors.white);
      prism(x + 1.63, y + .52, .99, .25, .24, .29, colors.coral);
      prism(x + .79, y + 1.42, .04, .23, .26, .40, colors.ink);
      prism(x + .56, y + 1.24, .43, .77, .73, .15, colors.purple);
      prism(x + .56, y + 1.83, .51, .77, .14, .61, colors.purple);
    }

    function person(x, y, shirt, skin, hair) {
      prism(x + .05, y + .12, 0, .16, .22, .45, colors.ink);
      prism(x + .38, y + .12, 0, .16, .22, .45, colors.ink);
      prism(x, y, .43, .6, .47, .53, shirt);
      prism(x + .11, y + .05, .96, .39, .37, .37, skin);
      prism(x + .095, y + .03, 1.28, .42, .39, .16, hair);
    }

    ctx.fillStyle = room.farewell ? '#d8bfef' : '#dad0ef';
    for (let y = 14; y < 145; y += 8) {
      for (let x = 12; x < 260; x += 8) ctx.fillRect(x, y, 1, 1);
    }
    star(41, 52, 6, '#a992d8');
    star(222, 40, 5, room.farewell ? '#d98d78' : '#b59cde');
    star(229, 95, 3, '#b59cde');
    star(56, 111, 3, '#b59cde');

    plane([[-.45, -.34, -.68], [7.55, -.34, -.68], [7.55, 7.64, -.68], [-.45, 7.64, -.68]], '#dfd1f2');
    prism(0, 0, -.45, 7.15, 7.15, .45, ['#f3ebfd', '#bda6e3', '#987dc5']);
    for (let x = 0; x < 7; x++) {
      for (let y = 0; y < 7; y++) {
        plane([[x + .04, y + .04, 0], [x + 1, y + .04, 0], [x + 1, y + 1, 0], [x + .04, y + 1, 0]],
          (x + y) % 2 === 0 ? '#eaddf9' : '#dfcff1');
      }
    }

    const wallHeight = room.floor ? 5.35 : 3.65;
    prism(0, 0, 0, .15, 7.15, wallHeight, ['#e6d8fa', '#d1bdee', room.farewell ? '#d4b8ed' : '#c2a9e7']);
    prism(.15, 0, 0, 7, .15, wallHeight, ['#f0e4fc', room.farewell ? '#ebcaf0' : '#d9c6ef', '#b296da']);
    for (let x = 0.7; x + 1.17 < 7.15; x += 1.55) {
      back(x, 1.68, 1.17, 1.50, '#a68bd3');
      back(x + .07, 1.77, 1.03, 1.32, room.farewell ? '#ffe2a3' : '#efdcfa');
      back(x + .54, 1.77, .055, 1.32, '#ae92d7');
      back(x + .07, 2.41, 1.03, .07, '#ae92d7');
    }
    if (room.floor) {
      prism(.16, .15, 3.51, 5.2, 3.2, .14, colors.purple);
      for (let x = 0.65; x < 5.3; x += 1.45) back(x, 4.02, 1.02, .84, '#ffdc9c');
      side(.48, 3.83, 1.18, 1.07, '#fff4dd');
      const [markX, markY] = project([.17, 1.22, 4.08]);
      ctx.font = 'bold 9px monospace';
      ctx.fillStyle = '#68519b';
      ctx.fillText('?', markX, markY);
    }

    if (room.board) {
      side(1.5, 1.25, 2.97, 1.65, '#9d81cb');
      side(1.63, 1.36, 2.72, 1.43, '#fff6f1');
      for (const [y, z, color] of [[1.84, 2.16, '#e6adcd'], [2.43, 1.94, '#fad297'], [2.98, 2.19, '#b8a2ed'], [3.6, 1.77, '#a9d5c8']]) {
        side(y, z, .36, .36, color);
      }
      side(1.88, 1.61, .95, .075, '#b49fda');
    } else {
      side(2.13, 1.62, 1.26, 1.29, '#9d81cb');
      side(2.23, 1.74, 1.04, 1.03, '#f5e8fc');
      side(2.49, 1.91, .58, .46, '#c3ace9');

    plant(5.8, .75, true);
    if (room.team) desk(1.18, 1.02, '#9cdbc7');
    desk(room.team ? 3.6 : 2.43, room.team ? 2.87 : 2.62);
    plant(.83, 5.2);
    if (room.team) {

      star(...project([2.83, 5.81, 1.4]), 3, '#ffca72');

      star(96, 26, 4, '#e9a96d');
      star(176, 28, 3, '#e5a16b');
      star(203, 63, 4, '#ffe4a2');
    }
  }

  <script>
(() => {
  const content = window.gameContent;
  const game = window.createGame(content);
  const select = (selector) => document.querySelector(selector);
  const stage = select('#stage');
  const office = select('#office-art');
  const milestones = select('#milestones');
  const history = select('#history');
  const historyToggle = select('#history-toggle');
  const total = content.rounds.length;
  const saveKey = 'sasha-est-minutka-v1';

  let run = game.initial();
  let phase = 'intro';
  let replayIndex;
  let ending;
  let historyOpen = false;
  let storageAvailable = true;

  try {
    const raw = JSON.parse(localStorage.getItem(saveKey));
    if (raw && raw.started === true) {
      run = game.restore(raw.moves);
      if (raw.pending && run.moves.length && run.moves.length === raw.moves.length) phase = 'report';
      else phase = run.moves.length === total ? 'ending' : 'choice';
    }
  } catch {
    // Invalid or inaccessible storage should never stop a local game.
  }

  function element(tag, className, value) {
    const node = document.createElement(tag);
    if (className) node.className = className;
    if (value) node.textContent = value;
    return node;
  }

  function button(text, className, handler) {
    const node = element('button', className, text);
    node.type = 'button';
    node.addEventListener('click', handler);
    return node;
  }

  function enter(nextPhase, moveFocus = true) {
    phase = nextPhase;
    ending = phase === 'ending' ? game.finish(run) : null;
    replayIndex = ending?.references.at(-1);
    if (phase === 'intro') historyOpen = false;
    render();
    if (moveFocus) {
      select('#scene-title').focus({ preventScroll: true });
      if (stage.getBoundingClientRect().top < 0) {
        stage.scrollIntoView({ block: 'start' });
      }
    }
  }

  function save() {
    try {
      localStorage.setItem(saveKey, JSON.stringify({
        started: phase !== 'intro', moves: game.encode(run), pending: phase === 'report',
      }));
      storageAvailable = true;
    } catch {
      storageAvailable = false;
    }
  }

  function pick(id) {
    if (phase !== 'choice') return;
    run = game.act(run, id);
    enter('report');
  }

  function renderHeader(label, count) {
    const meta = element('div', 'scene-meta');
    const category = element('span', 'category', label);
    const counter = element('div', 'counter');
    counter.append(element('span', 'counter-label', phase === 'ending' ? 'Карьера пройдена' : 'Решение'));
    const value = [count, total].map((number) => String(number).padStart(2, '0')).join(' / ');
    counter.append(element('span', 'counter-value', value));
    meta.append(category, counter);
    const progress = element('div', 'progress');
    progress.setAttribute('aria-hidden', 'true');
    for (let i = 0; i < total; i++) {
      const segment = element('i');
      if (i < run.moves.length) segment.className = 'is-complete';
      else if (i + 1 === count && phase === 'choice') segment.className = 'is-current';
      progress.append(segment);
    }
    stage.append(meta, progress);
  }

  function sceneTitle(text, className = 'scene-title') {
    const node = element('h1', className, text);
    node.id = 'scene-title';
    node.tabIndex = -1;
    return node;
  }

  function quoteCard(quote) {
    const figure = element('figure', 'photo');
    const block = element('blockquote', '', quote.text);
    figure.append(block);
    if (quote.author) figure.append(element('figcaption', '', quote.author));
    return figure;
  }

  function factCard(fact, scene) {
    const card = element('aside', 'fact');
    card.append(element('h2', 'fact-heading', 'А как было у Саши'));
    card.append(element('p', '', fact.text));
    const actual = scene?.choices.find(({ id }) => id === fact.actualChoice);
    if (actual) card.append(element('p', 'fact-choice', 'Выбор Саши · ' + actual.text));
    if (fact.photo?.src) {
      const figure = element('figure', 'photo');
      const img = element('img');
      img.src = fact.photo.src;
      img.alt = fact.photo.alt || '';
      img.addEventListener('error', () => figure.remove());
      figure.append(img);
      if (fact.photo.caption) figure.append(element('figcaption', '', fact.photo.caption));
      card.append(figure);
    }
    if (fact.quote?.text) card.append(quoteCard(fact.quote));
    return card;
  }

  function renderIntro() {
    renderHeader('Входящее сообщение', 0);
    const message = element('div', 'intro-message');
    const sender = element('div', 'message-sender');
    const avatar = element('span', 'avatar', 'К');
    avatar.setAttribute('aria-hidden', 'true');
    const senderInfo = element('div');
    senderInfo.append(element('strong', '', content.intro.sender), element('span', '', 'только что'));
    sender.append(avatar, senderInfo);
    const title = sceneTitle(content.intro.title, 'scene-title intro-title');
    title.append(document.createTextNode(' '), element('span', 'intro-accent', content.intro.accent));
    message.append(sender, title);
    const action = button(content.intro.button, 'primary intro-action', () => enter('choice'));
    stage.append(message, action);
  }

  function renderChoice(scene) {
    renderHeader(scene.label, run.moves.length + 1);
    const prompt = element('div', 'prompt');
    prompt.append(sceneTitle(scene.title), element('p', 'scene-body', scene.body));
    const choices = element('div', 'choices');
    scene.choices.forEach((choice, index) => {
      const node = button('', 'choice', () => pick(choice.id));
      const key = element('kbd', 'choice-key', String(index + 1));
      key.setAttribute('aria-hidden', 'true');
      node.append(key, element('span', 'choice-text', choice.text), element('i', 'choice-indicator'));
      node.setAttribute('aria-keyshortcuts', String(index + 1));
      choices.append(node);
    });
    stage.append(prompt, choices);
  }

  function renderReport() {
    const { scene, choice, changes } = run.moves.at(-1);
    renderHeader(scene.label, run.moves.length);
    const report = element('div', 'report');
    report.append(element('p', 'stage-label', 'После твоего решения'), sceneTitle(choice.text, 'scene-title report-title'));
    report.append(element('p', 'scene-body', choice.result));
    const deltas = element('div', 'deltas');
    for (const [key, value] of Object.entries(changes)) {
      if (!value) continue;
      const delta = (value > 0 ? '+' : '−') + Math.abs(value);
      const chip = element('span', 'delta ' + (value > 0 ? 'up' : 'down'));
      chip.append(element('strong', '', delta), element('span', '', content.stats[key].label));
      deltas.append(chip);
    }
    if (!deltas.childElementCount) deltas.append(element('span', 'delta neutral', 'Показатели без изменений'));
    report.append(deltas);
    if (scene.fact?.text) report.append(factCard(scene.fact, scene));
    const next = run.moves.length === total ? 'К финалу' : 'Дальше';
    stage.append(report, button(next, 'primary next', () => enter(run.moves.length === total ? 'ending' : 'choice')));
  }

  function updateReplaySelection() {
    stage.querySelectorAll('input[name="replay"]').forEach((radio) => {
      radio.checked = Number(radio.value) === replayIndex;
    });
    const selectOther = select('#replay-other');
    if (selectOther) selectOther.value = ending.references.includes(replayIndex) ? '' : String(replayIndex);
  }

  function renderEnding() {
    renderHeader('Финал', total);
    const story = element('div', 'ending-story');
    story.append(sceneTitle(ending.title), element('p', 'scene-body', ending.body));
    if (ending.fact?.text) story.append(factCard(ending.fact));
    const quotes = ending.quotes?.filter((quote) => quote.text) ?? [];
    if (quotes.length) story.append(...quotes.map(quoteCard));
    else if (ending.fallbackQuote) story.append(element('p', 'farewell-note', ending.fallbackQuote));

    const replay = element('fieldset', 'replay');
    replay.append(element('legend', '', 'Какие решения к этому привели'));
    const evidence = element('div', 'evidence');
    for (const index of ending.references) {
      const { scene, choice } = run.moves[index];
      const label = element('label', 'evidence-card');
      const radio = element('input');
      radio.type = 'radio';
      radio.name = 'replay';
      radio.value = index;
      radio.addEventListener('change', () => {
        replayIndex = index;
        updateReplaySelection();
      });
      const description = element('span');
      description.append(element('small', '', scene.label), element('strong', '', choice.text));
      label.append(radio, description);
      evidence.append(label);
    }
    const other = element('label', 'other-fork');
    other.append(element('span', '', 'Другая развилка'));
    const dropdown = element('select');
    dropdown.id = 'replay-other';
    dropdown.append(new Option('Выбрать из истории', ''));
    run.moves.forEach(({ scene }, index) => {
      if (!ending.references.includes(index)) dropdown.append(new Option((index + 1) + '. ' + scene.title, String(index)));
    });
    dropdown.addEventListener('change', () => {
      replayIndex = dropdown.value === '' ? ending.references.at(-1) : Number(dropdown.value);
      updateReplaySelection();
    });
    other.append(dropdown);
    replay.append(evidence, other);
    const actions = element('div', 'ending-actions');
    actions.append(
      button('Переиграть с этой развилки', 'primary', () => {
        run = game.rewind(run, replayIndex);
        enter('choice');
      }),
      button('Начать другую карьеру', 'secondary', () => {
        run = game.initial();
        enter('intro');
      }),
    );
    stage.append(story, replay, actions);
    updateReplaySelection();
  }

  function renderMeters() {
    const meters = select('#meters');
    meters.replaceChildren();
    for (const [key, stat] of Object.entries(content.stats)) {
      const row = element('div', 'stat stat-' + key);
      const metric = element('div', 'metric');
      const icon = element('span', 'stat-icon stat-icon-' + key);
      icon.setAttribute('aria-hidden', 'true');
      const label = element('span', 'stat-name', stat.label);
      label.id = 'stat-' + key;
      metric.append(icon, label, element('span', 'stat-value', String(run.stats[key])));
      const bar = element('meter', 'meter');
      bar.max = 100;
      bar.value = run.stats[key];
      bar.setAttribute('aria-labelledby', label.id);
      const visual = element('div', 'meter-track');
      visual.setAttribute('aria-hidden', 'true');
      const fill = element('span', 'meter-fill');
      fill.style.width = run.stats[key] + '%';
      visual.append(fill);
      row.append(metric, bar, visual);
      meters.append(row);
    }
  }

  function renderOffice() {
    const product = run.tags.has('product');
    const hybrid = run.tags.has('hybrid');
    const team = run.moves.length >= 6 || (run.tags.get('delegate') ?? 0) >= 2;
    const floor = run.tags.has('business-line');
    const farewell = phase === 'ending';
    const board = product || hybrid || team;
    window.drawOffice(office, { board, team, floor, farewell });

    let label = 'Разработка';
    let description = 'Один стол, один монитор';
    if (product || hybrid) {
      label = product ? 'Продукт' : 'Две роли';
      description = 'Доску уже принесли';
    }
    if (team) {
      label = run.tags.has('developer') ? 'Команда чекаута' : 'Команда';
      description = 'В офисе стало больше людей';
    }
    if (floor) {
      label = 'Бизнес-линия';
      description = 'У второго этажа пока нет назначения';
    }
    if (farewell) {
      label = 'Проводы';
      description = 'Торт уже на столе';
    }
    select('#office-state').textContent = label;
    select('#office-caption').textContent = description;
    office.setAttribute('aria-label', 'Пиксельный офис. ' + description);
  }

  function renderHistory() {
    const roundIndex = Math.max(0, run.moves.length - (phase === 'report' ? 1 : 0));
    const chapterIndex = content.rounds[roundIndex]?.chapter ?? content.chapters.length - 1;
    milestones.replaceChildren();
    content.chapters.forEach(({ title, note }, index) => {
      const item = element('li', 'milestone');
      if (phase === 'ending' || index < chapterIndex) item.classList.add('reached');
      if (index === chapterIndex) {
        item.classList.add('active');
        item.setAttribute('aria-current', 'step');
      }
      const marker = element('i', 'marker');
      marker.setAttribute('aria-hidden', 'true');
      item.append(marker, element('strong', '', title), element('span', '', note));
      milestones.append(item);
    });

    historyToggle.hidden = run.moves.length === 0;
    historyToggle.setAttribute('aria-expanded', String(historyOpen && run.moves.length > 0));
    history.hidden = !historyOpen || !run.moves.length;
    history.replaceChildren();
    for (const { scene, choice } of run.moves) {
      const item = element('li');
      item.append(element('strong', '', scene.title), element('span', '', choice.text));
      history.append(item);
    }
  }

  function render() {
    stage.replaceChildren();
    stage.dataset.view = phase;
    if (phase === 'intro') renderIntro();
    if (phase === 'choice') renderChoice(game.current(run));
    if (phase === 'report') renderReport();
    if (phase === 'ending') renderEnding();
    renderMeters();
    renderOffice();
    renderHistory();
    save();
    select('#save-status').textContent = storageAvailable
      ? (phase === 'intro' ? 'Один проход · 4–6 минут' : 'Прогресс сохранён')
      : 'Браузер не сохранил прогресс';
  }

  historyToggle.addEventListener('click', () => {
    historyOpen = !historyOpen;
    renderHistory();
  });

  document.addEventListener('keydown', (event) => {
    if (phase !== 'choice' || event.altKey || event.ctrlKey || event.metaKey || event.repeat) return;
    if (event.target.closest('input, select, textarea, [contenteditable]')) return;
    const key = Number(event.key);
    if (key < 1 || key > 3 || !Number.isInteger(key)) return;
    const choice = game.current(run).choices[key - 1];
    if (choice) {
      event.preventDefault();
      pick(choice.id);
    }
  });

  const fullscreen = select('#fullscreen');
  fullscreen.hidden = !document.fullscreenEnabled;
  fullscreen.addEventListener('click', async () => {
    try {
      if (document.fullscreenElement) await document.exitFullscreen();
      else await document.documentElement.requestFullscreen();
    } catch {
      fullscreen.hidden = true;
    }
  });
  document.addEventListener('fullscreenchange', () => {
    select('#fullscreen-label').textContent = document.fullscreenElement ? 'Выйти из полноэкранного режима' : 'На весь экран';
  });

  enter(phase, false);
})();
  </script>
</body>
</html>
